name: Android checks
on:
  pull_request:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Build debug and run tests
        if: matrix.api == 35
        run: ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" :mobile:assembleDebug :mobile:testDebugUnitTest :networking:test :mobile:lintDebug
      - name: Summarize JVM tests and lint
        if: matrix.api == 35
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for module in ('mobile', 'networking'):
              suites = [ET.parse(p).getroot() for p in Path(module + '/build/test-results').rglob('TEST-*.xml')]
              print('TEST_SUMMARY', module, {k: sum(int(s.get(k, 0)) for s in suites) for k in ('tests', 'failures', 'errors')})
          for p in Path('mobile/build/reports').glob('lint-results*.xml'):
              issues = ET.parse(p).getroot().findall('issue')
              print('LINT_SUMMARY', {level: sum(i.get('severity') == level for i in issues) for level in ('Error', 'Warning')})
              for issue in issues:
                  if issue.get('severity') == 'Error':
                      print('LINT_ERROR', issue.get('id'), [loc.get('file') for loc in issue.findall('location')])
              assert not any(i.get('severity') == 'Error' for i in issues), 'Android lint errors must be resolved'
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise offline playback on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/test-offline-device.sh
      - name: Collect device evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for p in Path("offline-screenshots").glob("*.png"):
              print("OFFLINE_SCREENSHOT:" + p.name + ":" + base64.b64encode(p.read_bytes()).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-checks-api-${{ matrix.api }}
          path: |
            mobile/build/reports/
            networking/build/reports/
            mobile/build/outputs/apk/debug/
            offline-screenshots/
            android-crashes.txt
