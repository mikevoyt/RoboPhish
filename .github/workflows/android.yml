name: Android checks
on:
  pull_request:
  push:
    branches: [codex/offline-listening]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and run tests
        run: ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" :mobile:assembleDebug :mobile:testDebugUnitTest :networking:test :mobile:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-checks
          path: |
            mobile/build/reports/
            networking/build/reports/
            mobile/build/outputs/apk/debug/
